<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreams Business Group (DBG) - ERP & Fund Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      // ⚠️ এখানে আপনার Firebase প্রজেক্টের কনফিগারেশন বসান
      const firebaseConfig = {
        apiKey: "AIzaSyBeD2SSyT2ihCVgklfw5im95LXIWlkszps",
        authDomain: "dbgsoftware-6c9b9.firebaseapp.com",
        projectId: "dbgsoftware-6c9b9",
        storageBucket: "dbgsoftware-6c9b9.firebasestorage.app",
        messagingSenderId: "726215672769",
        appId: "1:726215672769:web:f3b7dc52377cf1f387e540"
      };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

      window.dbgAuth = auth;
      window.dbgDb = dbStore;

      // Firebase Sync Function
      window.dbgSyncToFirebase = async function() {
          if (!auth.currentUser) return;
          const userDocRef = doc(dbStore, "dbg_data", auth.currentUser.uid);
          try {
              const payload = {
                  logo: window.db.logo,
                  members: window.db.members,
                  deposits: window.db.deposits,
                  investments: window.db.investments,
                  investorProfiles: window.db.investorProfiles,
                  accounts: window.db.accounts,
                  lastUpdated: new Date().toISOString()
              };
              await setDoc(userDocRef, payload, { merge: true });
              const statusEl = document.getElementById('dbgAuthStatus');
              if (statusEl) statusEl.innerText = "Firebase-এ ডাটা সিঙ্ক সফল হয়েছে!";
          } catch (e) {
              console.error("Firebase Sync Error:", e);
              const statusEl = document.getElementById('dbgAuthStatus');
              if (statusEl) statusEl.innerText = "Firebase সিঙ্কে সমস্যা হয়েছে: " + e.message;
          }
      };

      // Restore Data from Firebase
      window.dbgFetchFromFirebase = async function() {
          if (!auth.currentUser) return;
          const userDocRef = doc(dbStore, "dbg_data", auth.currentUser.uid);
          try {
              const docSnap = await getDoc(userDocRef);
              if (docSnap.exists()) {
                  const data = docSnap.data();
                  if (data.logo) window.db.logo = data.logo;
                  if (data.members) window.db.members = data.members;
                  if (data.deposits) window.db.deposits = data.deposits;
                  if (data.investments) window.db.investments = data.investments;
                  if (data.investorProfiles) window.db.investorProfiles = data.investorProfiles;
                  if (data.accounts) window.db.accounts = data.accounts;
                  
                  window.saveLocalData();
                  window.renderAll();
              }
          } catch (e) {
              console.error("Firebase Fetch Error:", e);
          }
      };

      // Auth Listener
      onAuthStateChanged(auth, (user) => {
          if (user) {
              document.body.classList.remove('dbg-logged-out');
              document.getElementById('dbg-auth-overlay').classList.add('hidden');
              window.dbgFetchFromFirebase();
          } else {
              document.body.classList.add('dbg-logged-out');
              document.getElementById('dbg-auth-overlay').classList.remove('hidden');
          }
      });

      // Login Form Handling
      document.addEventListener('DOMContentLoaded', () => {
          const loginForm = document.getElementById('dbgFirebaseLoginForm');
          if (loginForm) {
              loginForm.addEventListener('submit', async (e) => {
                  e.preventDefault();
                  const email = document.getElementById('dbgLoginEmail').value;
                  const password = document.getElementById('dbgLoginPassword').value;
                  const errEl = document.getElementById('dbgAuthError');
                  errEl.classList.remove('show');
                  
                  try {
                      await signInWithEmailAndPassword(auth, email, password);
                  } catch (err) {
                      errEl.innerText = "লগইন ব্যর্থ হয়েছে: " + err.message;
                      errEl.classList.add('show');
                  }
              });
          }
      });
    </script>

    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f8fafc;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background-color: white; color: black; }
            .shadow-lg, .shadow-sm, .shadow-md { box-shadow: none !important; }
            .border { border-color: #000 !important; }
            .main-content { margin-left: 0 !important; width: 100% !important; padding: 0 !important; overflow: visible !important; }
            .tab-content.hidden { display: none !important; }
            .tab-content.block { display: block !important; }
            .overflow-y-auto, .overflow-x-auto { overflow: visible !important; max-height: none !important; }
            table { width: 100% !important; border-collapse: collapse !important; }
            tr { page-break-inside: avoid !important; }
            button, input, select, textarea { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    
        .dbg-print-company-header { display: none; }

        /* ================= FIREBASE AUTHENTICATION GATE ================= */
        body.dbg-logged-out > *:not(#dbg-auth-overlay) {
            visibility: hidden !important;
        }
        #dbg-auth-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #312e81 55%, #4338ca 100%);
            padding: 20px;
        }
        #dbg-auth-overlay.hidden { display: none !important; }
        .dbg-auth-card {
            width: min(420px, 100%);
            background: #fff;
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
        }
        .dbg-auth-card input {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 11px 13px;
            outline: none;
        }
        .dbg-auth-card input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,.12);
        }
        .dbg-auth-error {
            display: none;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 9px 11px;
            font-size: 13px;
            line-height: 1.5;
        }
        .dbg-auth-error.show { display: block; }
        .dbg-auth-status {
            font-size: 12px;
            color: #64748b;
            min-height: 18px;
        }

        /* Print button fix */
        body.dbg-printing > *:not(#dbg-print-root) { display: none !important; }
        body.dbg-printing #dbg-print-root { display: block !important; width: 100% !important; }
        @media print {
            body.dbg-printing { margin: 0 !important; padding: 0 !important; background: #fff !important; }
            body.dbg-printing #dbg-print-root { display: block !important; width: 100% !important; }
            body.dbg-printing #dbg-print-root .no-print { display: none !important; }
            body.dbg-printing #dbg-print-root table { width: 100% !important; border-collapse: collapse !important; }
            body.dbg-printing #dbg-print-root .dbg-print-company-header { display: block !important; text-align: center !important; margin: 0 0 18px 0 !important; padding: 0 0 10px 0 !important; border-bottom: 1px solid #000 !important; }
            body.dbg-printing #dbg-print-root .dbg-print-company-header h1 { margin: 0 !important; font-size: 24px !important; font-weight: 700 !important; color: #000 !important; }
            body.dbg-printing #dbg-print-root .dbg-print-company-header p { margin: 2px 0 0 0 !important; font-size: 14px !important; font-weight: 600 !important; color: #333 !important; }
            body.dbg-printing #dbg-print-root .grid, body.dbg-printing #dbg-print-root .dbg-print-two-col-cards { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
            body.dbg-printing #dbg-print-root #profileContainer .grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
            body.dbg-printing #dbg-print-root th,
            body.dbg-printing #dbg-print-root td { border: 1px solid #888 !important; padding: 5px 7px !important; }
        }

        /* Role-based access control */
        body.dbg-accountant-mode .dbg-admin-only { display: none !important; }
        body.dbg-accountant-mode #tab-deposits,
        body.dbg-accountant-mode #tab-accounts { display: flex !important; }
</style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex dbg-logged-out">

    <!-- FIREBASE LOGIN OVERLAY -->
    <div id="dbg-auth-overlay">
        <div class="dbg-auth-card">
            <div class="text-center mb-6">
                <div class="mx-auto mb-3 w-16 h-16 rounded-2xl bg-indigo-100 flex items-center justify-center">
                    <i data-lucide="shield-check" class="w-9 h-9 text-indigo-700"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">ড্রিমস বিজনেস গ্রুপ</h2>
                <p class="text-sm text-slate-500 mt-1">নিরাপদ লগইন</p>
            </div>

            <form id="dbgFirebaseLoginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ইমেইল</label>
                    <input id="dbgLoginEmail" type="email" autocomplete="username" required placeholder="আপনার Firebase Email লিখুন">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">পাসওয়ার্ড</label>
                    <div class="relative">
                        <input id="dbgLoginPassword" type="password" autocomplete="current-password" required placeholder="পাসওয়ার্ড লিখুন" class="pr-12">
                    </div>
                </div>

                <div id="dbgAuthError" class="dbg-auth-error"></div>
                <div id="dbgAuthStatus" class="dbg-auth-status"></div>

                <button id="dbgLoginButton" type="submit" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-3 rounded-xl transition">
                    লগইন করুন
                </button>
            </form>

            <div class="mt-5 pt-4 border-t text-center text-[11px] text-slate-400">
                Firebase Authentication দ্বারা সুরক্ষিত
            </div>
        </div>
    </div>

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-indigo-900 text-white min-h-screen flex flex-col justify-between p-4 fixed left-0 top-0 bottom-0 z-50 no-print shadow-xl overflow-y-auto">
        <div>
            <div class="flex items-center space-x-3 space-x-reverse border-b border-indigo-800 pb-4 mb-6">
                <div class="relative group cursor-pointer flex-shrink-0">
                    <label for="logoUpload" class="cursor-pointer block">
                        <img id="groupLogoImg" src="https://via.placeholder.com/50?text=DBG" class="w-12 h-12 rounded-xl object-cover border border-amber-400 shadow-lg">
                        <div class="absolute inset-0 bg-black/50 rounded-xl flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                            <i data-lucide="camera" class="w-4 h-4 text-white"></i>
                        </div>
                    </label>
                    <input type="file" id="logoUpload" accept="image/*" onchange="uploadGroupLogo(this)" class="hidden">
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide leading-tight">ড্রিমস বিজনেস গ্রুপ</h1>
                    <p class="text-[11px] text-indigo-300">Dreams Business Group</p>
                </div>
            </div>

            <nav class="space-y-1.5">
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="nav-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-white bg-indigo-800 transition">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> ড্যাশবোর্ড
                </button>
                <button onclick="switchTab('members')" id="tab-members" class="nav-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-indigo-200 hover:bg-indigo-800/60 hover:text-white transition">
                    <i data-lucide="users" class="w-5 h-5"></i> সদস্য তালিকা
                </button>
                <button onclick="switchTab('deposits')" id="tab-deposits" class="nav-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-indigo-200 hover:bg-indigo-800/60 hover:text-white transition">
                    <i data-lucide="wallet" class="w-5 h-5"></i> ডিপোজিট কালেকশন
                </button>
                <button onclick="switchTab('accounts')" id="tab-accounts" class="nav-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-indigo-200 hover:bg-indigo-800/60 hover:text-white transition">
                    <i data-lucide="receipt-text" class="w-5 h-5"></i> আয়-ব্যয় হিসাব
                </button>
            </nav>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content flex-grow ml-64 p-6 overflow-y-auto">
        <section id="view-dashboard" class="tab-content block space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-xl font-bold text-gray-800">ফান্ড ওভারভিউ</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                    <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-lg">
                        <p class="text-sm text-gray-600">মোট সদস্য</p>
                        <p id="dashTotalMembers" class="text-2xl font-bold text-indigo-700">0</p>
                    </div>
                    <div class="p-4 bg-emerald-50 border border-emerald-100 rounded-lg">
                        <p class="text-sm text-gray-600">সর্বমোট ডিপোজিট</p>
                        <p id="dashTotalFund" class="text-2xl font-bold text-emerald-700">৳0</p>
                    </div>
                    <div class="p-4 bg-amber-50 border border-amber-100 rounded-lg">
                        <p class="text-sm text-gray-600">খরচ তহবিলে অবশিষ্ট</p>
                        <p id="dashExpenseFundRemaining" class="text-2xl font-bold text-amber-700">৳0</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const LOCAL_KEYS = {
            logo: 'dbg_logo',
            members: 'dbg_members',
            deposits: 'dbg_deposits',
            investments: 'dbg_investments',
            investorProfiles: 'dbg_investor_profiles',
            accounts: 'dbg_accounts'
        };

        function readJSON(key, fallback) {
            try {
                const value = localStorage.getItem(key);
                return value ? JSON.parse(value) : fallback;
            } catch (_) { return fallback; }
        }

        window.db = {
            logo: localStorage.getItem(LOCAL_KEYS.logo) || '',
            members: readJSON(LOCAL_KEYS.members, []),
            deposits: readJSON(LOCAL_KEYS.deposits, []),
            investments: readJSON(LOCAL_KEYS.investments, []),
            investorProfiles: readJSON(LOCAL_KEYS.investorProfiles, []),
            accounts: readJSON(LOCAL_KEYS.accounts, [])
        };

        window.saveLocalData = function() {
            localStorage.setItem(LOCAL_KEYS.logo, window.db.logo);
            localStorage.setItem(LOCAL_KEYS.members, JSON.stringify(window.db.members));
            localStorage.setItem(LOCAL_KEYS.deposits, JSON.stringify(window.db.deposits));
            localStorage.setItem(LOCAL_KEYS.investments, JSON.stringify(window.db.investments));
            localStorage.setItem(LOCAL_KEYS.investorProfiles, JSON.stringify(window.db.investorProfiles));
            localStorage.setItem(LOCAL_KEYS.accounts, JSON.stringify(window.db.accounts));
        };

        window.saveData = function() {
            window.saveLocalData();
            window.renderAll();
            if (typeof window.dbgSyncToFirebase === 'function') {
                window.dbgSyncToFirebase();
            }
        };

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const targetView = document.getElementById(`view-${tabId}`);
            if (targetView) targetView.classList.remove('hidden');
        };

        window.renderAll = function() {
            window.renderDashboard();
            if (window.lucide) lucide.createIcons();
        };

        window.renderDashboard = function() {
            const totalMembers = window.db.members ? window.db.members.length : 0;
            const totalFund = window.db.deposits ? window.db.deposits.reduce((sum, d) => sum + parseFloat(d.amount || 0), 0) : 0;
            const totalExpenseFundCollected = window.db.deposits ? window.db.deposits.reduce((sum, d) => sum + parseFloat(d.expenseAmount || 0), 0) : 0;
            const totalExpenseSpent = window.db.accounts ? window.db.accounts.filter(a => a.type === 'EXPENSE').reduce((sum, a) => sum + parseFloat(a.amount || 0), 0) : 0;
            
            const remainingExpense = totalExpenseFundCollected - totalExpenseSpent;

            const elMembers = document.getElementById('dashTotalMembers');
            const elFund = document.getElementById('dashTotalFund');
            const elExpense = document.getElementById('dashExpenseFundRemaining');

            if (elMembers) elMembers.innerText = totalMembers;
            if (elFund) elFund.innerText = '৳' + totalFund;
            if (elExpense) elExpense.innerText = '৳' + remainingExpense;
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.renderAll();
        });
    </script>
</body>
</html>
