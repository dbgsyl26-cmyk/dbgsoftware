<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreams Business Group (DBG) - ERP & Fund Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com"></script>
    <!-- Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f8fafc;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background-color: white; color: black; }
            .shadow-lg, .shadow-sm, .shadow-md { box-shadow: none !important; }
            .border { border-color: #000 !important; }
            .main-content { margin-left: 0 !important; width: 100% !important; padding: 0 !important; overflow: visible !important; }
            .tab-content.hidden { display: none !important; }
            .tab-content.block { display: block !important; }
            .overflow-y-auto, .overflow-x-auto { overflow: visible !important; max-height: none !important; }
            table { width: 100% !important; border-collapse: collapse !important; }
            tr { page-break-inside: avoid !important; }
            button, input, select, textarea { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        .dbg-print-company-header { display: none; }
        body.dbg-printing > *:not(#dbg-print-root) { display: none !important; }
        body.dbg-printing #dbg-print-root { display: block !important; width: 100% !important; }
        @media print {
            body.dbg-printing { margin: 0 !important; padding: 0 !important; background: #fff !important; }
            body.dbg-printing #dbg-print-root { display: block !important; width: 100% !important; }
            body.dbg-printing #dbg-print-root .no-print { display: none !important; }
            body.dbg-printing #dbg-print-root table { width: 100% !important; border-collapse: collapse !important; }
            body.dbg-printing #dbg-print-root .dbg-print-company-header { display: block !important; text-align: center !important; margin: 0 0 18px 0 !important; padding: 0 0 10px 0 !important; border-bottom: 1px solid #000 !important; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex">

    <!-- ১. সিকিউর লগইন ওভারলে ইন্টারফেস (যা ডাটাবেস ভেরিফিকেশন ছাড়া মূল পেজ সম্পূর্ণ ঢেকে রাখবে) -->
    <div id="dbg-login-overlay" style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background: #f4f6f9 !important; z-index: 999999999 !important; display: flex !important; justify-content: center !important; align-items: center !important; font-family: sans-serif !important;">
      <div style="background: #fff !important; padding: 40px !important; border-radius: 12px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important; width: 100% !important; max-width: 400px !important; box-sizing: border-box !important;">
        <h2 style="text-align: center !important; color: #333 !important; margin-bottom: 5px !important; font-weight: bold !important;">Dreams Business Group</h2>
        <p style="text-align: center !important; color: #777 !important; font-size: 14px !important; margin-top: 0 !important; margin-bottom: 25px !important;">ERP & Fund Management System</p>
        <div style="margin-bottom: 15px !important;">
          <label style="display: block !important; margin-bottom: 5px !important; color: #555 !important; font-weight: bold !important; font-size: 14px !important;">ইমেইল অ্যাড্রেস:</label>
          <input type="email" id="login-email" placeholder="example@dbg.com" style="width: 100% !important; padding: 10px !important; border: 1px solid #ccc !important; border-radius: 6px !important; box-sizing: border-box !important; font-size: 15px !important;">
        </div>
        <div style="margin-bottom: 10px !important; position: relative !important;">
          <label style="display: block !important; margin-bottom: 5px !important; color: #555 !important; font-weight: bold !important; font-size: 14px !important;">পাসওয়ার্ড:</label>
          <input type="password" id="login-password" placeholder="••••••••" style="width: 100% !important; padding: 10px !important; border: 1px solid #ccc !important; border-radius: 6px !important; box-sizing: border-box !important; font-size: 15px !important; padding-right: 40px !important;">
          <span id="toggle-password" style="position: absolute !important; right: 12px !important; top: 35px !important; cursor: pointer !important; color: #777 !important; font-size: 18px !important; user-select: none !important;">👁️</span>
        </div>
        <div style="text-align: right !important; margin-bottom: 20px !important;">
          <a href="#" id="link-forgot-password" style="color: #007bff !important; text-decoration: none !important; font-size: 13px !important; font-weight: bold !important;">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>
        <button id="btn-login" style="width: 100% !important; padding: 12px !important; background: #007bff !important; color: #fff !important; border: none !important; border-radius: 6px !important; font-size: 16px !important; font-weight: bold !important; cursor: pointer !important; transition: 0.2s !important;">লগইন করুন</button>
        <p id="login-error" style="color: #dc3545 !important; text-align: center !important; margin-top: 15px !important; font-size: 14px !important; display: none !important; font-weight: bold !important;"></p>
      </div>
    </div>

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-indigo-900 text-white min-h-screen flex flex-col justify-between p-4 fixed left-0 top-0 bottom-0 z-50 no-print shadow-xl overflow-y-auto">
        <div>
            <!-- Group Logo & Header -->
            <div class="flex items-center space-x-3 border-b border-indigo-800 pb-4 mb-6">
                <div class="relative group cursor-pointer flex-shrink-0">
                    <label for="logoUpload" class="cursor-pointer block">
                        <img id="groupLogoImg" src="https://placeholder.com" class="w-12 h-12 rounded-xl object-cover border border-amber-400 shadow-lg">
                    </label>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide leading-tight">ড্রিমস বিজনেস গ্রুপ</h1>
                    <p class="text-[11px] text-indigo-300">Dreams Business Group</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="space-y-1.5">
                <button class="nav-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-semibold text-white bg-indigo-800 transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> ড্যাশবোর্ড</button>
                <button class="nav-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-indigo-200 hover:bg-indigo-800/60 hover:text-white transition"><i data-lucide="users" class="w-5 h-5"></i> সদস্য তালিকা</button>
                <button class="nav-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-indigo-200 hover:bg-indigo-800/60 hover:text-white transition"><i data-lucide="wallet" class="w-5 h-5"></i> ডিপোজিট কালেকশন</button>
                <button class="nav-tab w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-indigo-200 hover:bg-indigo-800/60 hover:text-white transition"><i data-lucide="receipt-text" class="w-5 h-5"></i> আয়-ব্যয় হিসাব</button>
                <!-- লগআউট বাটন -->
                <button onclick="logoutUser()" class="w-full flex items-center gap-3 px-4 py-3 mt-8 rounded-xl font-medium bg-red-600/80 hover:bg-red-700 text-white transition"><i data-lucide="log-out" class="w-5 h-5"></i> লগআউট</button>
            </nav>
        </div>

        <!-- Google Drive Desktop Backup (Accountant লগইন করলে অটো হাইড হবে) -->
        <div id="drive-backup-section" class="border-t border-indigo-800 pt-4 space-y-2">
            <div class="text-[10px] font-semibold text-sky-200 text-center">☁️ Google Drive Backup</div>
            <button class="w-full bg-blue-600 text-xs py-2 px-3 rounded-lg text-white font-medium hover:bg-blue-700 transition">Drive Backup</button>
        </div>
    </aside>

    <!-- Main Content Container -->
    <main class="flex-1 main-content ml-64 p-8 overflow-x-hidden min-h-screen">
        <!-- ড্যাশবোর্ড কাউন্টার কার্ডসমূহ -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm font-semibold text-slate-500">মোট সদস্য সংখ্যা</p>
                <h3 id="total-members-count" class="text-3xl font-bold text-slate-800 mt-2">0 জন</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-sm font-semibold text-slate-500">সর্বমোট মূল ডিপোজিট ফান্ড</p>
                <h3 id="total-fund-display" class="text-3xl font-bold text-indigo-600 mt-2">৳ 0</h3>
            </div>
        </div>

        <!-- নতুন সদস্য ফরম -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8">
            <h3 class="text-lg font-bold text-slate-800 mb-4">새 নতুন সদস্য যোগ করুন</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="member-id" placeholder="সদস্য নম্বর (যেমন: DBG-001)" class="border p-2.5 rounded-xl w-full">
